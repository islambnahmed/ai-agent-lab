name: Gold Lab MVP tests
on:
  push:
    paths:
      - "products/gold-forecast/**"
      - ".github/workflows/gold-lab.yml"
  pull_request:
    paths:
      - "products/gold-forecast/**"
      - ".github/workflows/gold-lab.yml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check products/gold-forecast/forecast.mjs
          node --check products/gold-forecast/app.mjs
      - name: Forecast regression tests
        run: node --test products/gold-forecast/tests/*.test.mjs
