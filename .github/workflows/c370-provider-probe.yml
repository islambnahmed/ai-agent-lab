name: Seshat C370 read-only source probe
on:
  push:
    branches:
      - seshat/c370-live-observation-audit
    paths:
      - 'experiments/seshat/c370-live-observation-audit/**'
      - '.github/workflows/c370-provider-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline unit tests
        run: node --test experiments/seshat/c370-live-observation-audit/probe.test.mjs
      - name: Public provider probe (no raw-feed upload)
        run: node experiments/seshat/c370-live-observation-audit/probe.mjs
