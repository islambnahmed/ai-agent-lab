name: AI Agent Lab CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lab structure
        run: python tools/validate_lab.py
      - name: Test gold point-in-time and freshness gate
        run: python -m unittest discover -s tests -p 'test_gold*.py' -v
