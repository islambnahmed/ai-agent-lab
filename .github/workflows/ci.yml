name: AI Agent Lab CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate present lab artifacts
        run: python tools/validate_lab.py
      - name: Test optional-validator behavior with synthetic fixtures
        run: python -m unittest discover -s research/lumen -p test_lumen385_optional_validator.py -q
