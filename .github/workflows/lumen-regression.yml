name: Lumen regression (exact repository dependencies)

on:
  push:
    branches:
      - sandbox/worker-c
    paths:
      - "research/lumen/**"
      - ".github/workflows/lumen-regression.yml"
  pull_request:
    paths:
      - "research/lumen/**"
      - ".github/workflows/lumen-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: research/lumen
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic evaluation regressions
        run: |
          python -m unittest -q test_lumen366.py test_lumen367.py test_lumen368.py test_lumen369.py test_lumen370.py test_lumen371.py
      - name: Repeat with Python optimizations
        run: |
          python -O -m unittest -q test_lumen366.py test_lumen367.py test_lumen368.py test_lumen369.py test_lumen370.py test_lumen371.py
