name: Lumen regression (exact repository dependencies)

on:
  push:
    branches:
      - sandbox/worker-c
    paths:
      - "research/lumen/**"
      - ".github/workflows/lumen-regression.yml"
  pull_request:
    paths:
      - "research/lumen/**"
      - ".github/workflows/lumen-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: research/lumen
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self-test regression receipt generator
        run: python -m unittest -q test_lumen373_receipt.py
      - name: Run both modes and print exact-input regression receipt
        run: python lumen373_regression_receipt.py
      - name: Self-test isolated input snapshot runner
        run: python -m unittest -q test_lumen377_isolated_receipt.py
      - name: Run regression in disposable per-mode snapshots
        run: python lumen377_isolated_receipt.py
